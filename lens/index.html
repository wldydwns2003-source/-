<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNS 원본 찾기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f1115">
<style>
  :root { --bg: #0f1115; --panel: #181b22; --panel2: #20242d; --line: #2c313c;
    --text: #e8eaf0; --muted: #9aa1ae; --accent: #ff3b5c; --accent2: #25d3c4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; }
  h1 { margin: 0 0 14px; font-size: 20px; }
  h1 span { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .hidden { display: none !important; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
    min-height: 150px; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); padding: 16px; }
  .drop b { color: var(--text); font-size: 16px; }
  .preview { width: 100%; max-height: 380px; object-fit: contain; border-radius: 10px; background: #000; display: block; }
  button { font-family: inherit; }
  .btn { width: 100%; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; color: #fff; background: var(--accent); margin-top: 10px; }
  .btn.ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--text); font-weight: 500; font-size: 15px; }
  .status { color: var(--muted); font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
  .status.err { color: var(--accent); }
  .small { font-size: 13px; color: var(--muted); line-height: 1.6; }
  ol.small { padding-left: 18px; margin: 6px 0; }
  .small b { color: var(--text); }
  .pastebox { margin-top: 10px; min-height: 64px; border: 2px dashed var(--accent2); border-radius: 12px; padding: 12px;
    color: var(--text); text-align: center; outline: none; overflow: hidden; max-height: 120px; }
  .pastebox:empty::before { content: attr(data-ph); color: var(--muted); }
  .kw { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 SNS <span>원본 영상 찾기</span></h1>

  <section class="card">
    <label class="drop" id="drop" for="fileInput">
      <span style="font-size:34px">🖼️</span>
      <b>캡처 사진 선택</b>
      <span class="small">또는 스크린샷에서 <b>공유 → SNS검색</b></span>
    </label>
    <button class="btn ghost" id="pasteBtn">📋 캡처한 사진 붙여넣기</button>
    <div id="pasteBox" class="pastebox hidden" contenteditable="true" inputmode="none" data-ph="여기를 길게 눌러 → 붙여넣기"></div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">

    <img id="preview" class="preview hidden" alt="선택한 사진">
    <button class="btn hidden" id="findBtn">🔍 이 영상 원본 찾기</button>
    <button class="btn ghost hidden" id="changeBtn">다른 사진</button>
    <div class="status" id="status"></div>
  </section>

  <section class="card small">
    <b>찾는 방법</b>
    <ol class="small">
      <li><b>🔍 이 영상 원본 찾기</b> → 목록에서 <b>Google 렌즈</b>(또는 <b>Google</b>) 선택</li>
      <li>렌즈 결과 위 검색창에 <span class="kw">instagram</span> <span class="kw">tiktok</span> <span class="kw">youtube</span> 중 하나를 추가하면 그 SNS 게시물만 나와요</li>
      <li>렌즈 화면에서 네모 칸을 <b>영상 부분에만</b> 맞추면 더 잘 찾아요 (버튼·댓글 제외)</li>
    </ol>
    처음 한 번: 크롬 ⋮ → <b>앱 설치</b> 해두면 스크린샷 공유 목록에 <b>SNS검색</b>이 생겨요.
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let currentFile = null;

function setStatus(msg, err = false) {
  $('status').textContent = msg;
  $('status').className = 'status' + (err ? ' err' : '');
}

function setImage(file) {
  currentFile = file;
  $('preview').src = URL.createObjectURL(file);
  ['preview', 'findBtn', 'changeBtn'].forEach((id) => $(id).classList.remove('hidden'));
  ['drop', 'pasteBtn', 'pasteBox'].forEach((id) => $(id).classList.add('hidden'));
  setStatus('');
}

$('fileInput').onchange = (e) => { if (e.target.files[0]) setImage(e.target.files[0]); };
$('changeBtn').onclick = () => $('fileInput').click();

// ---------- 구글 렌즈로 넘기기 ----------
$('findBtn').onclick = async () => {
  if (!currentFile) return;
  const type = currentFile.type || 'image/png';
  const file = new File([currentFile], 'capture.' + (type.split('/')[1] || 'png'), { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      setStatus('렌즈 결과 위 검색창에 instagram / tiktok / youtube 를 추가해 보세요.');
    } catch (e) {
      if (e.name !== 'AbortError') setStatus('공유 실패: ' + e.message, true);
    }
  } else {
    setStatus('이 브라우저는 사진 공유를 지원하지 않아요.\n안드로이드 크롬에서 열거나, 갤러리에서 사진을 열고 렌즈 버튼을 눌러주세요.', true);
  }
};

// ---------- 다른 앱에서 "공유"로 들어온 사진 ----------
async function loadShared() {
  if (!new URLSearchParams(location.search).has('shared')) return;
  history.replaceState(null, '', location.pathname);
  try {
    const cache = await caches.open('shared-image');
    const res = await cache.match('./shared-image');
    if (!res) return setStatus('공유된 사진을 찾지 못했어요. 다시 공유해 주세요.', true);
    const blob = await res.blob();
    await cache.delete('./shared-image');
    setImage(new File([blob], 'shared.' + (blob.type.split('/')[1] || 'png'), { type: blob.type }));
    setStatus('아래 빨간 버튼을 누르면 구글 렌즈로 원본을 찾아요.');
  } catch (e) { setStatus('공유 사진 읽기 실패: ' + e.message, true); }
}

// ---------- 클립보드 붙여넣기 ----------
$('pasteBtn').onclick = async () => {
  try {
    if (!navigator.clipboard?.read) throw new Error('unsupported');
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find((t) => t.startsWith('image/'));
      if (type) return setImage(new File([await item.getType(type)], 'clipboard.' + type.split('/')[1], { type }));
    }
    setStatus('클립보드에 사진이 없어요. 캡처 후 "복사"를 먼저 눌러주세요.\n또는 아래 칸을 길게 눌러 붙여넣기 해보세요.', true);
  } catch {
    setStatus('바로 읽기가 막혀 있어요. 아래 점선 칸을 길게 눌러 → 붙여넣기 하세요.');
  }
  $('pasteBox').classList.remove('hidden');
  $('pasteBox').focus();
};
document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); setImage(item.getAsFile()); }
});
$('pasteBox').addEventListener('input', async () => {
  const img = $('pasteBox').querySelector('img');
  $('pasteBox').innerHTML = '';
  if (!img) return setStatus('사진이 아니에요. 캡처 사진을 복사한 뒤 다시 붙여넣어 주세요.', true);
  try {
    const blob = await (await fetch(img.src)).blob();
    setImage(new File([blob], 'pasted.' + (blob.type.split('/')[1] || 'png'), { type: blob.type || 'image/png' }));
  } catch { setStatus('붙여넣은 사진을 읽지 못했어요. "캡처 사진 선택"으로 골라주세요.', true); }
});

// ---------- 시작 ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(loadShared, loadShared);
} else {
  loadShared();
}
</script>
</body>
</html>
