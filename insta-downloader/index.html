<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인스타 다운로더</title>
<style>
  :root {
    --bg: #faf9f7; --card: #ffffff; --text: #1d1b19; --muted: #6f6a64; --line: #e6e2dc;
    --accent: #d6336c; --accent-2: #f08c00; --ok: #2b8a3e; --err: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --card: #1f1d1b; --text: #f1eee9; --muted: #a39d95; --line: #34312d; --ok: #69db7c; --err: #ff8787; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .box { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .box:focus-within { border-color: var(--accent); }
  input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 16px; padding: 10px; }
  button { border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; font-size: 15px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .opts { display: flex; gap: 16px; margin: 12px 4px 0; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #status { min-height: 24px; margin: 18px 4px; font-size: 15px; white-space: pre-wrap; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: r .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes r { to { transform: rotate(360deg); } }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 32px 4px 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  li .u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  li .r { flex: none; } li .r.ok { color: var(--ok); } li .r.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1><span>인스타</span> 원본 다운로더</h1>
  <p class="sub">릴스·게시물 주소를 붙여넣으면 바로 원본 화질로 저장됩니다.</p>

  <form class="box" id="f">
    <input id="url" type="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off" autofocus>
    <button id="btn" type="submit">다운로드</button>
  </form>
  <div class="opts">
    <label><input type="checkbox" id="auto" checked> 붙여넣으면 즉시 다운로드</label>
    <label><input type="checkbox" id="clip"> 창으로 돌아오면 클립보드 자동 확인</label>
  </div>

  <div id="status"></div>

  <h2>최근 기록</h2>
  <ul id="hist"></ul>
</main>

<script>
const RE = /https?:\/\/(?:www\.|m\.)?instagram\.com\/(?:[\w.]+\/)?(?:p|reels?|tv)\/[\w-]+/i;
const $ = id => document.getElementById(id);
const input = $('url'), btn = $('btn'), statusEl = $('status');
const done = new Set();
let busy = false;

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
$('auto').checked = store.get('auto', true);
$('clip').checked = store.get('clip', false);
$('auto').onchange = e => store.set('auto', e.target.checked);
$('clip').onchange = e => store.set('clip', e.target.checked);

function setStatus(html, cls = '') { statusEl.className = cls; statusEl.innerHTML = html; }
function addHist(url, text, ok) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="u"></span><span class="r ${ok ? 'ok' : 'err'}"></span>`;
  li.querySelector('.u').textContent = url;
  li.querySelector('.r').textContent = text;
  $('hist').prepend(li);
}

async function download(raw) {
  const m = (raw || '').match(RE);
  if (!m) { setStatus('인스타그램 게시물/릴스 주소를 넣어 주세요.', 'err'); return; }
  const url = m[0];
  if (busy) return;
  busy = true; btn.disabled = true;
  setStatus('<span class="spin"></span>원본 화질로 받는 중…');
  try {
    const res = await fetch('/api/download?url=' + encodeURIComponent(url));
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || `서버 오류 (${res.status})`);
    }
    const cd = res.headers.get('Content-Disposition') || '';
    const name = decodeURIComponent((cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)/i) || [, 'instagram'])[1]);
    const count = res.headers.get('X-File-Count') || '1';
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    const mb = (blob.size / 1048576).toFixed(1);
    setStatus(`✅ 저장 완료: ${name} (${count}개, ${mb}MB)`, 'ok');
    addHist(url, `${count}개 · ${mb}MB`, true);
    done.add(url);
    input.value = '';
  } catch (e) {
    setStatus('❌ ' + e.message, 'err');
    addHist(url, '실패', false);
  } finally {
    busy = false; btn.disabled = false; input.focus();
  }
}

$('f').onsubmit = e => { e.preventDefault(); download(input.value); };

// 붙여넣기 / 입력과 동시에 즉시 다운로드
input.addEventListener('paste', e => {
  if (!$('auto').checked) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (RE.test(text)) { e.preventDefault(); input.value = text.trim(); download(text); }
});
input.addEventListener('input', () => {
  if ($('auto').checked && RE.test(input.value) && !busy) download(input.value);
});

// 창으로 돌아왔을 때 클립보드에 새 인스타 주소가 있으면 자동 다운로드
window.addEventListener('focus', async () => {
  if (!$('clip').checked || busy || !navigator.clipboard?.readText) return;
  try {
    const m = (await navigator.clipboard.readText()).match(RE);
    if (m && !done.has(m[0])) { input.value = m[0]; download(m[0]); }
  } catch {}
});
</script>
</body>
</html>
